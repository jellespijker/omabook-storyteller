id: no-throw-literal
language: javascript
severity: error
message: Throw an Error whose message says why, in words the reader can act on (throw new Error("...")).
note: Omabook shows the message of a thrown Error to the person; a thrown string loses where it came from.
# A rethrow (`throw error;`) is fine: it is an Error already.
rule:
  kind: throw_statement
  has:
    any:
      - kind: string
      - kind: template_string
      - kind: number
      - kind: binary_expression
